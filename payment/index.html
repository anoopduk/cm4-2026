<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="description" content="CM4 2026 payment page for registered participants.">
<title>CM4 2026 | Payment</title>
<link rel="stylesheet" href="../styles.css">
<style>
.payment-shell{min-height:100vh;display:grid;place-items:center;padding:2rem;background:var(--paper)}
.payment-card{width:min(620px,100%);background:white;border:1px solid var(--line);border-radius:1.5rem;padding:clamp(1.5rem,5vw,3.5rem);box-shadow:0 24px 70px rgba(8,63,64,.10)}
.payment-logo{width:110px;margin:0 0 2rem}.payment-logo img{display:block;width:100%;mix-blend-mode:multiply}
.payment-card .eyebrow{color:var(--teal);margin:0 0 1rem}.payment-card h1{font-size:clamp(2.5rem,8vw,4.8rem);line-height:1;margin:0 0 1.5rem}.payment-card p{color:var(--muted);line-height:1.7}.payment-card .button{margin-top:1rem}.payment-note{margin-top:2rem;padding-top:1rem;border-top:1px solid var(--line);font-size:.82rem}
</style>
</head>
<body>
<main class="payment-shell">
  <section class="payment-card" aria-labelledby="payment-title">
    <a class="payment-logo" href="../" aria-label="CM4 2026 home"><img src="../logo.webp" alt="CM4 2026"></a>
    <p class="eyebrow">CM4 2026 · Registered participants</p>
    <h1 id="payment-title">Payment</h1>
    <p>Use the existing CM4 payment page to complete registration payment.</p>
    <a class="button" href="https://sites.google.com/duk.ac.in/cm4-2026/payment" rel="noreferrer">Continue to payment <span aria-hidden="true">↗</span></a>
    <p class="payment-note">3–6 December 2026 · Club Mahindra Poovar, Thiruvananthapuram, Kerala, India</p>
  </section>
</main>
</body>
</html>

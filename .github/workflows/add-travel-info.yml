name: Add CM4 travel information

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-travel:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update venue travel information
        env:
          OLD_B64: 
          NEW_B64: 
          CSS_B64: 
        run: |
          python -c "import os,base64,pathlib; p=pathlib.Path('index.html'); s=p.read_text(); old=base64.b64decode(os.environ['OLD_B64']).decode(); new=base64.b64decode(os.environ['NEW_B64']).decode(); assert old in s, 'Expected venue section not found'; p.write_text(s.replace(old,new,1)); c=pathlib.Path('styles.css'); css=c.read_text(); add=base64.b64decode(os.environ['CSS_B64']).decode(); c.write_text(css if '.travel-block{' in css else css+add)"
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/add-travel-info.yml
          git add index.html styles.css .github/workflows/add-travel-info.yml
          git commit -m "Add travel information for CM4 venue"
          git push

name: Refine CM4 design and theme

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  refine:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refine UI, typography, copy and add theme switch
        run: |
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          index_path = Path('index.html')
          index = index_path.read_text()

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'Expected {label} not found; refusing partial update')
              return text.replace(old, new, 1)

          index = replace_once(
              index,
              '<meta name="viewport" content="width=device-width,initial-scale=1">',
              '<meta name="viewport" content="width=device-width,initial-scale=1">\n<meta name="color-scheme" content="light dark">\n<meta name="theme-color" id="theme-color" content="#f4f1e8">',
              'viewport meta'
          )

          index = replace_once(
              index,
              '<title>CM4 2026 | Computational and Machine Learning Modelling</title>\n<link rel="stylesheet" href="styles.css">',
              dedent('''\
              <title>CM4 2026 | Computational and Machine Learning Modelling</title>
              <script>
                (() => {
                  try {
                    const saved = localStorage.getItem('cm4-theme');
                    const theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
                    document.documentElement.dataset.theme = theme;
                  } catch (_) {
                    document.documentElement.dataset.theme = 'light';
                  }
                })();
              </script>
              <link rel="stylesheet" href="styles.css">
              <script src="theme.js" defer></script>'''),
              'head assets'
          )

          index = replace_once(
              index,
              '  </nav>\n  <a class="button button-small" href="https://forms.gle/JE7BGkwDA1iDN3zG8" target="_blank" rel="noreferrer">Registration</a>',
              dedent('''\
                </nav>
                <button class="theme-toggle" type="button" data-theme-toggle aria-label="Switch to dark theme" title="Switch colour theme">
                  <span class="theme-toggle-icon theme-toggle-sun" aria-hidden="true">☀</span>
                  <span class="theme-toggle-icon theme-toggle-moon" aria-hidden="true">☾</span>
                  <span class="theme-toggle-label">Theme</span>
                </button>
                <a class="button button-small" href="https://forms.gle/JE7BGkwDA1iDN3zG8" target="_blank" rel="noreferrer">Registration</a>'''),
              'header registration button'
          )

          index = replace_once(
              index,
              '<p class="hero-intro">International conference organised by Digital University Kerala, in honour of Professor E. D. Jemmis on the occasion of his 75th birthday.</p>',
              '<p class="hero-intro">CM4 2026 is an international conference organised by Digital University Kerala in honour of Professor E. D. Jemmis on the occasion of his 75th birthday.</p>',
              'hero introduction'
          )

          index = replace_once(
              index,
              '<div class="section-kicker light"><span>02</span><p>Confirmed participants</p></div>',
              '<div class="section-kicker light"><span>02</span><p>Participants</p></div>',
              'participants kicker'
          )

          index = replace_once(
              index,
              '<div class="registration-head"><h2>Registration</h2><p>For invited participants. Registration includes accommodation and local travel.</p></div>',
              '<div class="registration-head"><h2>Registration</h2><p>Registration is for invited participants and includes accommodation and local travel.</p></div>',
              'registration introduction'
          )

          index_path.write_text(index)

          Path('theme.js').write_text(dedent(r'''\
          (() => {
            const root = document.documentElement;
            const toggle = document.querySelector('[data-theme-toggle]');
            const metaTheme = document.querySelector('#theme-color');
            const system = window.matchMedia('(prefers-color-scheme: dark)');

            const getStored = () => {
              try { return localStorage.getItem('cm4-theme'); } catch (_) { return null; }
            };

            const store = (theme) => {
              try { localStorage.setItem('cm4-theme', theme); } catch (_) {}
            };

            const apply = (theme) => {
              root.dataset.theme = theme;
              if (metaTheme) metaTheme.setAttribute('content', theme === 'dark' ? '#081617' : '#f4f1e8');
              if (toggle) {
                const next = theme === 'dark' ? 'light' : 'dark';
                toggle.setAttribute('aria-label', `Switch to ${next} theme`);
                toggle.setAttribute('title', `Switch to ${next} theme`);
              }
            };

            apply(root.dataset.theme || (system.matches ? 'dark' : 'light'));

            toggle?.addEventListener('click', () => {
              const next = root.dataset.theme === 'dark' ? 'light' : 'dark';
              store(next);
              apply(next);
            });

            system.addEventListener?.('change', (event) => {
              if (!getStored()) apply(event.matches ? 'dark' : 'light');
            });
          })();
          '''))

          css_path = Path('styles.css')
          css = css_path.read_text()
          old_import = "@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Newsreader:ital,opsz,wght@1,6..72,500&display=swap');"
          new_import = "@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,500;0,6..72,600;1,6..72,500&display=swap');"
          if old_import not in css:
              raise SystemExit('Expected font import not found; refusing partial update')
          css = css.replace(old_import, new_import, 1)

          marker = '/* CM4 design refinement: theme, typography, accessibility */'
          if marker not in css:
              css += dedent(r'''\

              /* CM4 design refinement: theme, typography, accessibility */
              :root{
                --header-bg:rgba(244,241,232,.93);
                --focus:#0d6665;
                --shadow:0 18px 50px rgba(8,63,64,.09);
              }
              html{color-scheme:light}
              html[data-theme="dark"]{
                color-scheme:dark;
                --ink:#edf4f0;
                --muted:#a6b8b2;
                --paper:#081617;
                --paper-2:#102425;
                --teal:#7ccfc5;
                --deep:#041112;
                --lime:#d5ef72;
                --line:rgba(237,244,240,.16);
                --header-bg:rgba(8,22,23,.93);
                --focus:#9ce1d9;
                --shadow:0 18px 50px rgba(0,0,0,.24);
              }
              body{line-height:1.5;text-rendering:optimizeLegibility;-webkit-font-smoothing:antialiased;transition:background-color .22s ease,color .22s ease}
              ::selection{background:var(--lime);color:#102a2b}
              [id]{scroll-margin-top:104px}
              a:focus-visible,button:focus-visible{outline:3px solid var(--focus);outline-offset:4px;border-radius:.35rem}
              .site-header{background:var(--header-bg);box-shadow:0 1px 0 var(--line);transition:background-color .22s ease,border-color .22s ease}
              .brand img{mix-blend-mode:normal}
              nav a{min-height:40px;display:inline-flex;align-items:center;letter-spacing:.005em}
              .button{color:#102a2b}
              h1{letter-spacing:-.05em;line-height:.96}
              h2,.travel-intro h3{font-family:"Newsreader",Georgia,serif;letter-spacing:-.035em}
              .prose,.hero-intro,.registration-head p,.travel-intro>p:last-child{max-width:68ch}
              .price-card{box-shadow:var(--shadow)}
              .accent-card{color:#102a2b}
              .accent-card li span,.accent-card small{color:#385154}
              .accent-card li{border-color:rgba(16,42,43,.18)}
              .text-link{transition:color .18s ease,border-color .18s ease}
              .text-link:hover{color:var(--teal)}
              .theme-toggle{appearance:none;border:1px solid var(--line);background:transparent;color:var(--ink);height:40px;padding:0 .8rem;border-radius:999px;display:inline-flex;align-items:center;gap:.45rem;font:600 .78rem/1 "DM Sans",Arial,sans-serif;cursor:pointer;white-space:nowrap;transition:background-color .18s ease,border-color .18s ease,color .18s ease}
              .theme-toggle:hover{background:var(--paper-2);border-color:rgba(13,102,101,.4)}
              .theme-toggle-icon{font-size:1rem;line-height:1;width:1.05rem;text-align:center}
              .theme-toggle-moon{display:none}
              html[data-theme="dark"] .theme-toggle-sun{display:none}
              html[data-theme="dark"] .theme-toggle-moon{display:inline-block}
              html[data-theme="dark"] .price-card{background:#102425;color:var(--ink);box-shadow:var(--shadow)}
              html[data-theme="dark"] .price-card li{border-color:var(--line)}
              html[data-theme="dark"] .price-card li span,html[data-theme="dark"] .price-card small{color:var(--muted)}
              html[data-theme="dark"] .accent-card{background:var(--lime);color:#102a2b}
              html[data-theme="dark"] .accent-card li{border-color:rgba(16,42,43,.18)}
              html[data-theme="dark"] .accent-card li span,html[data-theme="dark"] .accent-card small{color:#385154}
              html[data-theme="dark"] footer img{background:#f4f1e8}

              @media(max-width:900px){
                .site-header{height:auto;min-height:72px;flex-wrap:wrap;padding-top:.55rem;padding-bottom:.5rem;row-gap:.35rem}
                .brand{width:62px}
                .theme-toggle{margin-left:auto}
                nav{order:3;width:100%;margin:0;gap:1.35rem;overflow-x:auto;scrollbar-width:none;padding:.05rem 0 .1rem;-webkit-overflow-scrolling:touch}
                nav::-webkit-scrollbar{display:none}
                nav a:nth-child(3),nav a:nth-child(4){display:inline-flex}
                [id]{scroll-margin-top:128px}
              }
              @media(max-width:620px){
                .site-header{padding-left:1rem;padding-right:1rem}
                .brand{width:58px}
                .theme-toggle{width:40px;padding:0;justify-content:center}
                .theme-toggle-label{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
                nav{gap:1.15rem}
                nav a{font-size:.8rem}
              }
              @media(prefers-reduced-motion:reduce){body,.site-header,.theme-toggle,.text-link{transition:none!important}}
              ''')
          css_path.write_text(css)
          PY

      - name: Commit refinement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/refine-design.yml
          git add index.html styles.css theme.js .github/workflows/refine-design.yml
          git commit -m "Refine CM4 design and add theme switch"
          git push
